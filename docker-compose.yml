services:
  mysql:
    image: mysql:8.4
    container_name: sakila-mysql-group
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      # Mount initialization script into container's auto-exec folder
      - ./init-sakila.sh:/docker-entrypoint-initdb.d/init-sakila.sh
      # Named volume for database persistence
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysqldata:
